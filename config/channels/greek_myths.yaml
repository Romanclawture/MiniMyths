# Channel: Mini Myths (@Mini_Myths)
name: Mini Myths
handle: "@Mini_Myths"
genre: greek_myths
description: >
  Animated retellings of Greek mythology — heroes, monsters, and the gods
  behaving badly. Three-minute stories, zero fluff.

# Sourcing
sourcing:
  backlog: greek_myths          # curated list in minimyths/sourcing/backlogs.py
  wikipedia_categories:         # used to filter trending pages for this genre
    - Greek mythology
    - Greek heroes
    - Greek gods

# Script style — injected into the Claude prompt
script:
  tone: >
    Epic but playful. Hook in the first 5 seconds. Modern, punchy narration —
    think Greeking Out meets a movie trailer. No academic hedging.
  main_video:
    target_seconds: 180
    words_per_minute: 150
  short:
    target_seconds: 30
    words_per_minute: 160

# Voiceover
voiceover:
  backend: kokoro               # kokoro | elevenlabs | piper | espeak (draft)
  voice: bm_george              # picked by audition 2026-07; re-audition: python -m minimyths audition
  speed: 1.0                    # kokoro only; 0.95 = more gravitas, 1.05 = snappier
  # elevenlabs: backend: elevenlabs, voice: onwK4e9ZLuTAKqWW03F9 (Daniel)

# Visuals
visuals:
  image_backend: diffusers    # placeholder | diffusers | api  (see docs/video-generation.md)
  image_quality: final          # final = SDXL 30 steps; fast = SDXL-Turbo previews
  motion_backend: ken_burns     # ken_burns | draw_things (real animation, overnight)
  style: painted-epic           # default style pack (config/styles.yaml);
                                # per-episode override via "style" in script.json
  draw_things:                  # used when motion_backend: draw_things
    url: http://127.0.0.1:7860
    num_frames: 49              # ~2s real motion/beat; 81 ≈ 3.4s (more render time)
    steps: 20                   # 30 = higher quality, ~1.5x slower
    width: 1024                 # 64-px increments only; 1280x704 = full quality
    height: 576
    # extra: {}                 # passthrough for model-specific API knobs

# Assembly extras
assembly:
  # Drop a royalty-free track in assets/music/ (YouTube Audio Library is
  # free, no attribution) and uncomment — it loops under the narration,
  # auto-ducked whenever George speaks:
  # music: assets/music/epic_theme.mp3
  # music_db: -16

# Thumbnails
thumbnail:
  accent: "#FFB800"             # gold underline bar

# Publishing
publish:
  privacy: private              # private until we review the first uploads
  category_id: "24"             # Entertainment
  default_tags: [greek mythology, mythology, greek myths, history, animated story]
  cadence: monthly
  description_footer: |
    —
    ⚡ MINI MYTHS — epic myths in minutes.
    New myth every month. Subscribe so you don't miss the next one:
    https://youtube.com/@Mini_Myths?sub_confirmation=1

    #GreekMythology #Mythology #MiniMyths
