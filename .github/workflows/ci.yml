name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests PyYAML Pillow pytest
      - name: Run tests
        # python -m puts the repo root on sys.path so `minimyths` imports
        run: python -m pytest tests/ -v
